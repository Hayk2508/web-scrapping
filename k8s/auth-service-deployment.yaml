apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django-application
  template:
    metadata:
      labels:
        app: django-application
    spec:
      containers:
      - name: fastapi-container
        image: us-east1-docker.pkg.dev/winter-clone-429310-f7/web/auth-service-image:latest
        ports:
        - containerPort: 8000
        envFrom:
          - configMapRef:
              name: env-setup
